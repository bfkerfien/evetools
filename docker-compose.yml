services:
  triffnix-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - triffnix-backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.evetools-frontend.rule=Host(`evetools.triglavianconsortium.com`)"
      - "traefik.http.routers.evetools-frontend.entrypoints=websecure"
      - "traefik.http.routers.evetools-frontend.tls=true"
      - "traefik.http.routers.evetools-static.rule=Host(`evetools.triglavianconsortium.com`) && (PathPrefix(`/static/`) || PathPrefix(`/assets/`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.evetools-static.entrypoints=websecure"
      - "traefik.http.routers.evetools-static.tls=true"
      - "traefik.http.routers.evetools-static.priority=2000"
      - "traefik.http.routers.evetools-static.service=evetools-frontend"
      - "traefik.http.services.evetools-frontend.loadbalancer.server.port=80"
    networks:
      - traefik
      - app-internal
    ports:
      - "127.0.0.1:8080:80"

  triffnix-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: >
      sh -c "
        node ./backend/seedWormholes.js &&
        node ./backend/index.js
      "
    depends_on:
      postgres:
        condition: service_healthy
      fitting-service:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.evetools-api.rule=Host(`evetools.triglavianconsortium.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.evetools-api.entrypoints=websecure"
      - "traefik.http.routers.evetools-api.tls=true"
      - "traefik.http.routers.evetools-api.priority=100"
      - "traefik.http.services.evetools-backend.loadbalancer.server.port=3000"
      - "traefik.http.routers.evetools-embeds.rule=Host(`evetools.triglavianconsortium.com`) && HeaderRegexp(`User-Agent`, `Discordbot|Twitterbot|Slackbot|LinkedInBot|facebookexternalhit|embedly|WhatsApp|redditbot|TelegramBot`)"
      - "traefik.http.routers.evetools-embeds.entrypoints=websecure"
      - "traefik.http.routers.evetools-embeds.tls=true"
      - "traefik.http.routers.evetools-embeds.priority=1000"
      - "traefik.http.routers.evetools-embeds.service=evetools-backend"
    networks:
      - traefik
      - app-internal
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      FITTING_SERVICE_URL: http://fitting-service:8000
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"

  fitting-service:
    build:
      context: ./fitting-service
      no_cache: true
      args:
        PYFA_REF: ${FITTING_PYFA_REF:-latest}
    restart: unless-stopped
    environment:
      PYFA_ROOT: /opt/pyfa
      PYFA_GAME_DB: /opt/pyfa/eve.db
    networks:
      - app-internal

  postgres:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$\u007bPOSTGRES_USER\}\" -d postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evetools}
      POSTGRES_USER: ${POSTGRES_USER:-evetools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-internal

  market-worker:
    build:
      context: ./market-worker
    image: evetools/market-worker:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-internal

  market-orders-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        ./backend/scripts/importSDE.sh &&
        node ./backend/workers/marketOrdersWorker.js
      "
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    restart: unless-stopped
    networks:
      - app-internal

  market-history-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        node ./backend/workers/marketHistoryWorker.js
      "
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PGSSL: "false"
    restart: unless-stopped
    networks:
      - app-internal

networks:
  traefik:
    external: true
    name: traefik
  app-internal:
    driver: bridge

volumes:
  postgres-data:
  pyfa_home:
